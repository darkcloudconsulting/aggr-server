apiVersion: apps/v1
kind: Deployment
metadata:
  name: netmon
  labels:
    app.kubernetes.io/name: netmon
    app.kubernetes.io/part-of: aggr
spec:
  replicas: 1 # keep at 1: a second pod would only write duplicate points
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: netmon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netmon
        app.kubernetes.io/part-of: aggr
    spec:
      containers:
        - name: netmon
          image: node:20.5.0-alpine3.18
          command: ['node', '/netmon/index.js']
          env:
            # InfluxDB 1.8 service the points are written to. Adjust to your cluster.
            - name: INFLUX_HOST
              value: aggr-influx.monitoring.svc.cluster.local
            - name: INFLUX_PORT
              value: '8086'
            - name: NETMON_DATABASE
              value: netmon
            - name: NETMON_RETENTION
              value: 30d
            - name: NETMON_INTERVAL
              value: '5000'
            - name: NETMON_TARGETS
              value: 1.1.1.1:443,8.8.8.8:443,9.9.9.9:443,api.binance.com:443
            # trailing dot = absolute name, skips the cluster search domains (ndots:5)
            - name: NETMON_DNS_HOST
              value: www.google.com.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000 # "node" user of the image
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: script
              mountPath: /netmon
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: netmon-script
